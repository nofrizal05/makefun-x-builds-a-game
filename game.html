<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Runner — built by my AI agent from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f1226; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px; color: #fff; font-size: 22px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none; }
  #msg { position: absolute; left: 0; right: 0; top: 42%; text-align: center; color: #ffd23f; font-size: 34px; font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,.6); pointer-events: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #cdd3ff; font-size: 16px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><span id="score">SCORE 0</span><span id="best">BEST 0</span></div>
  <div id="msg"></div>
  <div id="hint">← → or tap to move &nbsp;•&nbsp; grab coins, dodge rocks</div>
</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

let W, H;
function resize() {
  W = cv.width = cv.clientWidth;
  H = cv.height = cv.clientHeight;
}
addEventListener('resize', resize);
resize();

// Three lanes the runner can stand in.
const lanes = () => [W * 0.22, W * 0.5, W * 0.78];
let lane = 1, targetX = lanes()[1], px = lanes()[1], py = 0;
let score = 0, best = 0, speed = 5, over = false, frame = 0;
let coins = [], rocks = [];

function spawnRow() {
  const ls = lanes();
  const coinLane = Math.floor(Math.random() * 3);
  coins.push({ x: ls[coinLane], y: -30, r: 16 });
  if (Math.random() < 0.6) {
    let rockLane = Math.floor(Math.random() * 3);
    if (rockLane === coinLane) rockLane = (rockLane + 1) % 3;
    rocks.push({ x: ls[rockLane], y: -30, w: 54, h: 54 });
  }
}

function move(d) {
  if (over) return;
  lane = Math.max(0, Math.min(2, lane + d));
  targetX = lanes()[lane];
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
  if ((e.key === ' ' || e.key === 'Enter') && over) restart();
});
cv.addEventListener('pointerdown', e => {
  if (over) return restart();
  move(e.clientX < W / 2 ? -1 : 1);
});

function restart() {
  score = 0; speed = 5; over = false;
  coins = []; rocks = []; msgEl.textContent = '';
}

function drawPlayer() {
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0f1226';
  ctx.beginPath(); ctx.arc(-9, -6, 5, 0, Math.PI * 2); ctx.arc(9, -6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0f1226'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 4, 11, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, c.r - 5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#b8860b'; ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.restore();
}

function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.fillStyle = '#8b93a7';
  ctx.beginPath();
  ctx.moveTo(-r.w / 2, r.h / 2); ctx.lineTo(-r.w / 2 + 8, -r.h / 2 + 6);
  ctx.lineTo(r.w / 2 - 6, -r.h / 2); ctx.lineTo(r.w / 2, r.h / 2 - 8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function step() {
  frame++;
  py = H * 0.78;
  px += (targetX - px) * 0.25;
  if (!over) {
    if (frame % 45 === 0) spawnRow();
    speed = 5 + Math.floor(score / 8) * 0.6;
    for (const c of coins) c.y += speed;
    for (const r of rocks) r.y += speed;
    coins = coins.filter(c => {
      if (Math.hypot(c.x - px, c.y - py) < 42) { score++; return false; }
      return c.y < H + 40;
    });
    rocks = rocks.filter(r => {
      if (Math.abs(r.x - px) < 48 && Math.abs(r.y - py) < 48) {
        over = true;
        best = Math.max(best, score);
        msgEl.textContent = 'GAME OVER — tap to retry';
        return false;
      }
      return r.y < H + 40;
    });
    scoreEl.textContent = 'SCORE ' + score;
    bestEl.textContent = 'BEST ' + best;
  }
  // Draw the road.
  ctx.fillStyle = '#0f1226';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b2044';
  ctx.fillRect(W * 0.08, 0, W * 0.84, H);
  ctx.strokeStyle = '#3a4270'; ctx.lineWidth = 4; ctx.setLineDash([26, 22]);
  ctx.beginPath();
  ctx.moveTo(W * 0.36, 0); ctx.lineTo(W * 0.36, H);
  ctx.moveTo(W * 0.64, 0); ctx.lineTo(W * 0.64, H);
  ctx.stroke();
  ctx.setLineDash([]);
  for (const c of coins) drawCoin(c);
  for (const r of rocks) drawRock(r);
  drawPlayer();
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
